version: '3.8'

services:
  crypto_bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Персистентное хранение базы данных
      - ./data:/app/data
      # Опционально: монтируем database.db напрямую
      - ./database.db:/app/database.db
    environment:
      - TZ=Europe/Moscow
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Политика перезапуска
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
